<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Código de autorización · LeoVisual.nl</title>
<style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#faf7f8;color:#1d1a1c;display:grid;place-items:center;min-height:100vh}
.c{background:#fff;border:1px solid #ece6e9;border-radius:16px;padding:28px;max-width:560px;width:calc(100% - 32px);box-shadow:0 6px 24px rgba(30,10,20,.06)}
b span{color:#9a9aa0}
code{display:block;word-break:break-all;background:#fde7ef;border-radius:10px;padding:14px;margin:14px 0;font-size:14px}
button{background:#e8457c;color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer}
p{color:#77707a}
</style>
</head>
<body>
<div class="c">
  <b>LeoVisual<span>.nl</span> · Publicador</b>
  <div id="r"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const code = q.get("code"), err = q.get("error_description") || q.get("error");
const r = document.getElementById("r");
if (code) {
  r.innerHTML = '<p>Copia este código y pégalo en la ventana negra de tu PC:</p><code id="k"></code><button id="b">Copiar</button>';
  document.getElementById("k").textContent = code;
  document.getElementById("b").onclick = async () => {
    try { await navigator.clipboard.writeText(code); document.getElementById("b").textContent = "Copiado ✓"; }
    catch (e) { getSelection().selectAllChildren(document.getElementById("k")); }
  };
} else {
  r.innerHTML = '<p>No ha llegado ningún código.</p><code id="k"></code>';
  document.getElementById("k").textContent = err || "Vuelve a intentarlo desde la ventana negra.";
}
// El código no se envía a ningún sitio: solo se muestra aquí.
history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
